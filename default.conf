# Zelfde gedrag als de standaard nginx-config, plus het juiste MIME-type voor het webapp-manifest.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
    }
}
