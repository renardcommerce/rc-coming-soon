<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Renard Commerce — Komt binnenkort</title>

  <link rel="icon" href="/icons/rc-choice-favicon.6c62c755.ico" sizes="32x32">
  <link rel="icon" href="/icons/rc-choice-favicon.22fbd5f3.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/rc-choice-apple-touch-icon.34406255.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#050B1C">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a;
      color: #f5f5f5;
      font-family: Georgia, serif;
    }

    .wrapper {
      text-align: center;
      padding: 2rem;
    }

    .wordmark {
      font-size: clamp(2rem, 6vw, 4rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      color: #fff;
    }

    .wordmark span {
      color: #c8a97e;
    }

    .tagline {
      margin-top: 1.25rem;
      font-size: clamp(0.9rem, 2.5vw, 1.1rem);
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #888;
    }
  </style>
</head>

<body>
  <div class="wrapper">
    <div class="wordmark" id="brand">
      Renard <span>Commerce</span>
    </div>

    <div class="tagline">
      Komt binnenkort
    </div>
  </div>

  <script>
    const host = window.location.hostname.toLowerCase();

    const isRcChoice =
      host === "rcchoice.nl" ||
      host === "www.rcchoice.nl" ||
      host === "rcchoice.com" ||
      host === "www.rcchoice.com" ||
      host === "rc-choice.nl" ||
      host === "www.rc-choice.nl" ||
      host === "rc-choice.com" ||
      host === "www.rc-choice.com";

    if (isRcChoice) {
      document.title = "RC CHOICE — Komt binnenkort";
      document.getElementById("brand").innerHTML =
        'RC <span>CHOICE</span>';
    }
  </script>
</body>
</html>
